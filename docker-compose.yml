services:

  banking-fraud-analytics:

    build: .

    container_name: banking-fraud-analytics

    environment:
      DOCKER_ENV: "true"
      DB_HOST: host.docker.internal
      DB_PORT: "5432"
      DB_NAME: banking_Transaction
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}

    extra_hosts:
      - "host.docker.internal:host-gateway"

    command: python python/database_validation.py